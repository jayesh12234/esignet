#------------------------ Mosip Components Base URLs ------------------------#
# Define base URLs for different components if required.
# Example:
# mosip_components_base_urls = auditmanager=api-internal.released.mosip.net;idrepository=api-internal.released.mosip.net;authmanager=api-internal.released.mosip.net;resident=api-internal.released.mosip.net;partnermanager=api-internal.released.mosip.net;idauthentication=api-internal.released.mosip.net;masterdata=api-internal.released.mosip.net;idgenerator=api-internal.released.mosip.net;policymanager=api-internal.released.mosip.net;preregistration=api-internal.released.mosip.net;keymanager=api-internal.released.mosip.net;mock-identity-system=api.released.mosip.net
# Feel free to add more components as needed.
# PMS/authmanager only — qa11new is used to generate the Mock MDS device p12, not for UI/IDA/login.
mosip_components_base_urls = authmanager=api-internal.qa11new.mosip.net;partnermanager=api-internal.qa11new.mosip.net;policymanager=api-internal.qa11new.mosip.net;

#------------------------ Module Name Pattern ------------------------#
# Define module name pattern if required.
# Example:
# moduleNamePattern = (mimoto|resident)
# Feel free to add more values as needed.
moduleNamePattern =

#------------------------ Feature File Filter ------------------------#
# Comma-separated list of feature file names (without .feature extension) to execute.
# Example: featureFilesToExecute = ConsentPage,LoginOptions,SignUp
# Leave empty to run ALL feature files.
featureFilesToExecute =

# Cucumber tag filter. Leave empty to run all scenarios (after featureFilesToExecute).
cucumber.filter.tags=

# Run only specific test case(s) by name - the easy way to run a single scenario.
# Comma-separated; a scenario runs if its name CONTAINS any of these (case-insensitive),
# so pasting the full name or just a distinctive part of it both work.
# Example: runOnlyScenario = TC_Browser_Compatibility_check_01
# Leave empty to run all scenarios (after featureFilesToExecute/cucumber.filter.tags).
runOnlyScenario =

# Mock MDS (embedded SBI for biometric UI tests - requires local browser)
useMockMds=true
# Optional override directory for a pre-existing device-dsk-partner.p12. Leave blank:
# Runner generates a fresh Device Provider p12 via p12EnvEndpoint on every run.
mdsP12Path =

# Biometric device discovery waits (seconds)
biometricScanningWaitSeconds=15
biometricDeviceDiscoveryTimeoutSeconds=60
biometricAuthenticationTimeoutSeconds=60

#------------------------ Uncomment for Local Run ------------------------#

# Path to the authentication certificates (if running locally, uncomment the below line and keep the value empty).
authCertsPath =

# X-XSS-Protection: Controls the XSS (Cross-Site Scripting) filter in browsers.
# Values: (yes/no)
xssProtectionCheck = no


