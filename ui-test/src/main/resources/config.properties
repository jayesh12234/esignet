#------------------------ Module Name Pattern ------------------------#
# Define module name pattern if required.
# Example:
# moduleNamePattern = (mimoto|resident)
# Feel free to add more values as needed.
moduleNamePattern =

#------------------------ Feature File Filter ------------------------#
# Comma-separated list of feature file names (without .feature extension) to execute.
# Example: featureFilesToExecute = ConsentPage,LoginOptions,SignUp
# Leave empty to run ALL feature files.
featureFilesToExecute =

# Cucumber tag filter. Leave empty to run all scenarios (after featureFilesToExecute).
# Failure 2 of 18: ConsentPage "Verifying Toggle button in consent screen"
cucumber.filter.tags=@ToggleButtonInConsentPage

# Mock MDS (embedded SBI for biometric UI tests - requires local browser)
useMockMds=true

# Biometric device discovery waits (seconds)
biometricScanningWaitSeconds=15
biometricDeviceDiscoveryTimeoutSeconds=60
biometricAuthenticationTimeoutSeconds=60

#------------------------ Uncomment for Local Run ------------------------#

# Path to the authentication certificates (if running locally, uncomment the below line and keep the value empty).
authCertsPath =

# X-XSS-Protection: Controls the XSS (Cross-Site Scripting) filter in browsers.
# Values: (yes/no)
xssProtectionCheck = no

# MOSIP-24755 / ES-206 / ES-21 Login with Inji automation
injiLinkCodeExpireSeconds=60
injiQrExpiredUiWaitBufferSeconds=90
injiMaxUiWaitSeconds=120
injiServerLinkCodeLimitPerTransaction=10
injiQrAutoRefreshLimit=3
injiActiveLinkCodeQueueSize=2
injiWalletLogoFile=inji_logo.png
injiLinkCodeLimitRedirectAttempt=11
