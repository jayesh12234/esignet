esignetDbPort = 5432
esignetDbName = mosip_esignet_go
esignetDbUsername = esignetuser_go
esignetDbPassword = 5CpGcQoEyf
esignetDbSchema = esignet
# Kernel.properties aliases used by ConsentDbUtil's fallback path
database-host = postgres.esqa.mosip.net
database-port = 5432
database-name = mosip_esignet_go
database-username = esignetuser_go
db-server = postgres.esqa.mosip.net
db-port = 5432
db-su-user = esignetuser_go
postgres-password = 5CpGcQoEyf

